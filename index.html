<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C9CBD1">
<title>Llave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--hormigon:#C9CBD1;--hormigon-osc:#B3B6BD;--tinta:#101114;--tinta-suave:#5A5D66;
--tarjeta:#F7F7F8;--azul:#1B2CF0;--verde:#0B7A3B;--rojo:#C8102E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--hormigon);color:var(--tinta);
min-height:100dvh;max-width:460px;margin:0 auto;
padding:28px 18px calc(28px + env(safe-area-inset-bottom))}
:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
.rotulo{font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--tinta-suave)}
h1{font-size:30px;line-height:.95;letter-spacing:-.02em;font-weight:800;
font-variation-settings:'wdth' 112;text-transform:uppercase;margin:5px 0}
.sesion{font-family:'Martian Mono',monospace;font-size:10.5px;color:var(--azul);letter-spacing:.08em}

.llave{position:relative;width:100%;aspect-ratio:85.6/54;margin-top:24px;
background:var(--tarjeta);border:2px solid var(--hormigon-osc);border-radius:14px;
display:grid;place-items:center;overflow:hidden;font:inherit;color:inherit;
text-align:center;cursor:default;transition:border-color .25s,box-shadow .25s,transform .12s}
.llave.tocable{cursor:pointer;border-color:var(--tinta);box-shadow:5px 5px 0 var(--tinta)}
.llave.tocable:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--tinta)}
.llave.armado{border-color:var(--azul);box-shadow:5px 5px 0 var(--azul)}
.llave.ok{border-color:var(--verde);box-shadow:5px 5px 0 var(--verde)}
.llave.mal{border-color:var(--rojo);box-shadow:5px 5px 0 var(--rojo)}
.llave-txt{position:relative;z-index:2;padding:0 20px}
.llave-titulo{font-size:17px;font-weight:700;line-height:1.2}
.llave-pie{font-family:'Martian Mono',monospace;font-size:9.5px;color:var(--tinta-suave);margin-top:8px;line-height:1.6}
.ondas{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .4s}
.llave.armado .ondas{opacity:1}
.ondas i{position:absolute;width:46%;aspect-ratio:1;border:2px solid var(--azul);border-radius:50%;transform:scale(.15);opacity:0}
.llave.armado .ondas i{animation:onda 2.6s ease-out infinite}
.llave.armado .ondas i:nth-child(2){animation-delay:.87s}
.llave.armado .ondas i:nth-child(3){animation-delay:1.74s}
@keyframes onda{0%{transform:scale(.15);opacity:0}18%{opacity:.7}100%{transform:scale(2.2);opacity:0}}
.llave.acierto{animation:golpe .4s ease}
@keyframes golpe{40%{transform:scale(.965)}}
@media (prefers-reduced-motion:reduce){
.llave.armado .ondas i{animation:none;opacity:.25;transform:scale(1.2)}
.llave.acierto{animation:none}}
.bytes{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:10px}
.byte{font-family:'Martian Mono',monospace;font-weight:600;font-size:12px;
background:var(--azul);color:var(--tarjeta);padding:5px 6px;border-radius:4px}

.o{display:flex;align-items:center;gap:12px;margin:26px 0 18px;
font-family:'Martian Mono',monospace;font-size:9px;text-transform:uppercase;
letter-spacing:.16em;color:var(--tinta-suave)}
.o::before,.o::after{content:'';flex:1;height:2px;background:var(--hormigon-osc)}
label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
font-weight:700;color:var(--tinta-suave);margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:13px;border:2px solid var(--tinta);
border-radius:10px;background:#fff;color:var(--tinta);margin-bottom:14px}
input::placeholder{color:#9C9FA8}
.btn{width:100%;font:inherit;font-weight:700;font-size:15px;padding:15px;border-radius:10px;
border:2px solid var(--tinta);background:var(--tinta);color:var(--tarjeta);cursor:pointer}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.4}
.msg{font-family:'Martian Mono',monospace;font-size:10.5px;line-height:1.8;
padding-left:11px;border-left:3px solid var(--tinta-suave);margin-top:18px}
.msg[hidden]{display:none}
.msg.ok{border-color:var(--verde);color:var(--verde)}
.msg.mal{border-color:var(--rojo);color:var(--rojo)}
[hidden]{display:none !important}
</style>
</head>
<body>

<div class="rotulo" id="rotulo">Llave universal</div>
<h1 id="titulo">Acceso</h1>
<div class="sesion" id="sesion"></div>

<button class="llave" id="llave" type="button">
<div class="ondas" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="llave-txt">
<div class="llave-titulo" id="llaveTitulo">Preparando la llave…</div>
<div class="llave-pie" id="llavePie">&nbsp;</div>
<div class="bytes" id="bytes"></div>
</div>
</button>

<div class="o" id="separador">o entra con tu clave</div>

<form id="form" autocomplete="on">
<label for="usuario">Usuario</label>
<input id="usuario" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="manu">
<label for="clave">Contraseña</label>
<input id="clave" name="password" type="password" autocomplete="current-password" placeholder="••••••">
<button class="btn" type="submit" id="btnEntrar">Entrar</button>
</form>

<p class="msg" id="msg" hidden></p>

<script>
/* ====== CONFIGURACIÓN (solo esto) ====== */
const CENTRAL_URL = 'https://script.google.com/macros/s/AKfycbxqb6AB1Tg5xgygsU2XzDSw8fqfk9wHPOJFTEJ3LHBNebhOL72FSfM_EvVcQs6_HIFW/exec';
/* ======================================= */

const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const APP = (Q.get('a') || '').toLowerCase();
const NOMBRE = Q.get('n') || '';
const SESION = (Q.get('s') || '').toUpperCase();
const ALTA = Q.get('m') === 'alta';
let aborto = null, ocupado = false;

function verClave(ver){
const v = !!ver && !ALTA;
$('form').hidden = !v;
$('separador').hidden = !v;
}

if (ALTA){
$('rotulo').textContent = 'Central de llaves';
$('titulo').textContent = 'Alta de tag';
$('form').hidden = true; $('separador').hidden = true;
$('sesion').textContent = 'Sesión ' + SESION;
}else{
$('rotulo').textContent = NOMBRE || 'Llave universal';
$('sesion').textContent = '';
verClave(false);
}

/* ---------- utilidades ---------- */
function pinta(clase, titulo, pie){
$('llave').className = 'llave' + (clase ? ' ' + clase : '');
if (titulo !== undefined) $('llaveTitulo').textContent = titulo;
if (pie !== undefined) $('llavePie').innerHTML = pie || '&nbsp;';
}
function mensaje(txt, tipo){
const m = $('msg');
if (!txt){ m.hidden = true; return; }
m.textContent = txt; m.className = 'msg' + (tipo ? ' ' + tipo : ''); m.hidden = false;
}
function pitido(bien){
try{
const c = new (window.AudioContext||window.webkitAudioContext)();
const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
o.type='square';
o.frequency.setValueAtTime(bien?1180:420,t);
o.frequency.setValueAtTime(bien?1580:300,t+.08);
g.gain.setValueAtTime(.055,t); g.gain.exponentialRampToValueAtTime(.0001,t+.2);
o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.21);
}catch(e){}
if (navigator.vibrate) navigator.vibrate(bien ? 55 : [70,60,70]);
}
function verBytes(serie){
$('bytes').innerHTML = '';
serie.split(':').forEach(b => {
const d = document.createElement('span'); d.className='byte'; d.textContent=b;
$('bytes').appendChild(d);
});
}

/* ---------- API (POST simple, con JSONP de reserva) ---------- */
async function llamar(datos){
try{
const r = await fetch(CENTRAL_URL, {
method:'POST', redirect:'follow',
headers:{'Content-Type':'text/plain;charset=utf-8'},
body: JSON.stringify(datos)
});
return await r.json();
}catch(e){ return jsonp(datos); }
}
function jsonp(datos){
return new Promise((resolve, reject) => {
const cb = 'cb_' + Math.random().toString(36).slice(2);
const s = document.createElement('script');
const limpiar = () => { delete window[cb]; s.remove(); };
window[cb] = d => { limpiar(); resolve(d); };
s.onerror = () => { limpiar(); reject(new Error('Sin conexión con la central')); };
s.src = CENTRAL_URL + '?' + new URLSearchParams(Object.assign({callback:cb}, datos));
document.body.appendChild(s);
setTimeout(() => { if (window[cb]){ limpiar(); reject(new Error('La central no responde')); } }, 20000);
});
}

/* ---------- NFC ---------- */
async function armar(porToque){
if (!('NDEFReader' in window)){
pinta('', 'Llave NFC no disponible',
ALTA ? 'Abre esta página en Chrome para Android' : 'Este navegador no lee NFC. Usa la contraseña.');
$('llave').disabled = true;
verClave(true);
return;
}
if (!porToque){
try{
const p = await navigator.permissions.query({name:'nfc'});
if (p.state !== 'granted'){
pinta('tocable', 'Toca para activar la llave', 'Solo la primera vez');
verClave(true);
return;
}
}catch(e){}
}
try{
const lector = new NDEFReader();
aborto = new AbortController();
await lector.scan({signal: aborto.signal});
lector.onreading = ev => {
const serie = (ev.serialNumber || '').toUpperCase();
if (!serie){ mensaje('Ese tag no expone número de serie.', 'mal'); return; }
enviar(serie);
};
lector.onreadingerror = () => mensaje('Lectura fallida. Acércalo más despacio.', 'mal');
pinta('armado', ALTA ? 'Acerca el tag nuevo' : 'Acerca tu llave',
'Escuchando · por detrás del móvil');
verClave(false);
}catch(err){
if (err.name === 'NotAllowedError'){
pinta('tocable', 'Toca para activar la llave', 'Permiso de NFC pendiente');
verClave(true);
}else{
pinta('', 'Llave no disponible', 'Enciende el NFC del móvil');
verClave(true);
}
}
}

/* ---------- envío ---------- */
async function enviar(serie){
if (ocupado) return;
const datos = ALTA
? { accion:'alta', s:SESION, serie:serie }
: Object.assign({ accion:'auth', app:APP, modo:'tag', serie:serie }, SESION ? {s:SESION} : {});
verBytes(serie);
pinta('acierto', 'Comprobando…', '');
procesar(datos);
}

async function procesar(datos){
ocupado = true; $('btnEntrar').disabled = true; mensaje('');
try{
const r = await llamar(datos);
if (r && r.ok){
pitido(true);
if (aborto){ aborto.abort(); aborto = null; }
$('form').hidden = true; $('separador').hidden = true;

if (r.destino === 'alta'){
pinta('ok', 'Tag capturado', 'Vuelve al panel de la central');
mensaje('Serie ' + r.serie, 'ok');
}else if (r.destino === 'tv'){
pinta('ok', 'Acceso concedido', r.nombre || '');
mensaje('Ya puedes soltar el móvil, ' + (r.app || 'la app') + ' está entrando.', 'ok');
setTimeout(() => {
try{ window.open('', '_self'); window.close(); }catch(e){}
setTimeout(() => { if (!document.hidden) mensaje('Ya puedes cerrar esta pestaña.', 'ok'); }, 300);
}, 1200);
}else{
pinta('ok', 'Hola, ' + (r.nombre || ''), 'Abriendo ' + (r.app || 'la app') + '…');
if (r.url) location.replace(r.url);
else mensaje('Esta app no tiene URL configurada en la central.', 'mal');
}
}else{
pitido(false);
pinta('mal', 'Acceso denegado', '');
mensaje((r && r.error) || 'No se pudo validar', 'mal');
ocupado = false; $('btnEntrar').disabled = false;
setTimeout(() => { if (!ocupado && !aborto) armar(true); }, 1400);
}
}catch(err){
pinta('mal', 'Error de red', '');
mensaje(err.message, 'mal');
ocupado = false; $('btnEntrar').disabled = false;
}
}

/* ---------- eventos ---------- */
$('llave').onclick = () => { if (!ocupado && !aborto) armar(true); };
$('form').onsubmit = e => {
e.preventDefault();
const u = $('usuario').value.trim(), c = $('clave').value;
if (!u || !c){ mensaje('Rellena usuario y contraseña.', 'mal'); return; }
$('bytes').innerHTML = '';
pinta('', 'Comprobando…', '');
procesar(Object.assign({ accion:'auth', app:APP, modo:'clave', usuario:u, clave:c },
SESION ? {s:SESION} : {}));
};
document.addEventListener('visibilitychange', () => {
if (document.visibilityState === 'visible' && !ocupado && !aborto) armar(false);
});

if (!ALTA && !APP){
pinta('mal', 'Falta la aplicación', '');
mensaje('Abre esta página desde el login de una app, no directamente.', 'mal');
$('form').hidden = true; $('separador').hidden = true;
}else{
armar(false);
}
</script>
</body>
</html>
